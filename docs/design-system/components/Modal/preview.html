<!-- @dsCard group="Overlays" height=360 subtitle="Two sanctioned variants — Panel (shadow-lg) + Card confirm (deliberately flat)" -->
<style>
  body { margin: 0; padding: 20px; background: var(--bg); font-family: var(--font-body); }
  .dim { background: var(--overlay); border-radius: var(--radius-lg); padding: 24px 16px; display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; align-items: flex-start; }
  .panel { background: var(--surface); border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); width: 300px; max-width: 100%; padding: 20px 22px; }
  .confirm { background: var(--surface); border-radius: var(--radius-lg); width: 250px; max-width: 100%; padding: 20px 22px; }
  h3 { font: 700 18px/1.2 var(--font-display); letter-spacing: -0.02em; margin: 0 0 8px; color: var(--text); }
  h4 { font: 500 15px/1.4 var(--font-body); margin: 0 0 6px; color: var(--text); }
  p { font: 400 14px/1.5 var(--font-body); color: var(--text-muted); margin: 0 0 14px; }
  .row { display: flex; gap: 10px; }
  .btn { display: inline-flex; align-items: center; height: 36px; padding: 0 16px; border: 0; cursor: pointer; border-radius: var(--radius-md); font: 600 14px/1 var(--font-body); transition: background-color .15s, transform .08s ease, filter .15s; }
  .btn:active { transform: scale(0.97); }
  .primary { background: var(--accent); color: var(--text-inverse); }
  .primary:hover { background: var(--accent-hover); }
  .ghost { background: var(--surface-2); color: var(--text); margin-left: auto; }
  .ghost:hover { background: var(--surface-3); }
  .danger { background: var(--red-500); color: var(--surface); }
  .danger:hover { filter: brightness(0.93); }
  .tag { font: 500 10.5px/1.4 var(--font-mono); color: var(--surface); opacity: .75; display: block; margin-bottom: 6px; }
</style>
<div class="dim">
  <div><span class="tag">Panel</span>
    <div class="panel">
      <h3>Share results</h3>
      <p>Anyone with the link can view this report.</p>
      <div class="row"><button class="btn primary">Copy link</button><button class="btn ghost">Close</button></div>
    </div>
  </div>
  <div><span class="tag">Card confirm</span>
    <div class="confirm">
      <h4>Delete this retro?</h4>
      <p>All answers and the report will be deleted. This cannot be undone.</p>
      <div class="row"><button class="btn ghost" style="margin-left:0">Cancel</button><button class="btn danger" style="margin-left:auto">Delete</button></div>
    </div>
  </div>
</div>
