<!-- @dsCard group="Forms" height=190 subtitle="Borderless input — hover deepens, focus draws the gold ring" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..600&display=swap">
<style>
  body { margin: 0; padding: 24px; background: var(--surface); font-family: var(--font-body); color: var(--text); }
  .field { max-width: 380px; }
  label { display: block; margin-bottom: 4px; font-size: 12px; font-weight: 600; line-height: 1.3; color: var(--text-muted); }
  textarea {
    width: 100%; box-sizing: border-box; padding: 8px 12px; border: 0; resize: vertical;
    background: var(--surface-2); border-radius: var(--radius-md);
    font: 400 14px/1.5 var(--font-body); color: var(--text); outline: none;
    transition: background .15s, box-shadow .15s;
  }
  textarea::placeholder { color: var(--text-subtle); }
  textarea:hover { background: var(--surface-3); }
  textarea:focus { background: var(--surface-2); box-shadow: 0 0 0 2px var(--focus-ring); }
</style>
<div class="field">
  <label for="anchor">What's slowing us down?</label>
  <textarea id="anchor" rows="3" placeholder="Be honest — it's anonymous."></textarea>
</div>
