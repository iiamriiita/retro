<!-- @dsCard group="Actions" height=150 subtitle="Primary · ghost · danger — press any to feel the dip" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..800&display=swap">
<style>
  body { margin: 0; padding: 24px; background: var(--bg); font-family: var(--font-body); }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    height: 36px; padding: 0 16px; border: 0; cursor: pointer;
    border-radius: var(--radius-md);
    font: 600 14px/1 var(--font-body); letter-spacing: -0.01em;
    transition: background-color .15s, transform .08s ease;
  }
  .btn:active { transform: scale(0.97); }
  .primary { background: var(--accent); color: var(--text-inverse); }
  .primary:hover { background: var(--accent-hover); }
  .primary:active { background: var(--accent-press); }
  .ghost { background: var(--surface-2); color: var(--text); }
  .ghost:hover { background: var(--surface-3); }
  .danger { background: var(--red-500); color: #ffffff; }
  .danger:hover { filter: brightness(0.93); }
  .btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
  svg { width: 15px; height: 15px; }
</style>
<div class="row">
  <button class="btn primary">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v2M12 19v2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M3 12h2M19 12h2M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>
    Generate AI report
  </button>
  <button class="btn ghost">Regenerate</button>
  <button class="btn danger">Delete retro</button>
  <button class="btn primary" disabled>Generating…</button>
</div>
