<style>
  body { margin: 0; padding: 24px; background: var(--bg); font-family: var(--font-body); color: var(--text); }
  .dots { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .dot { width: 8px; height: 8px; border-radius: var(--radius-pill); background: var(--surface-3); }
  .dot.on { background: var(--accent); }
  .cap { font: 500 12px/1.4 var(--font-body); color: var(--text-subtle); margin-bottom: 20px; }
  .track { max-width: 320px; height: 6px; border-radius: var(--radius-pill); background: var(--surface-3); overflow: hidden; margin-bottom: 6px; }
  .fill { width: 60%; height: 100%; background: var(--accent); border-radius: var(--radius-pill); }
</style>
