<!-- @dsCard group="Surfaces" height=210 subtitle="Flat card on the warm ground — surface steps, not shadows" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Hanken+Grotesk:wght@400..600&display=swap">
<style>
  body { margin: 0; padding: 24px; background: var(--bg); font-family: var(--font-body); color: var(--text); }
  .card { background: var(--surface); border-radius: var(--radius-lg); padding: 20px 22px; max-width: 420px; }
  h2 { margin: 0 0 6px; font: 700 18px/1.2 var(--font-display); letter-spacing: -0.02em; }
  p { margin: 0 0 12px; font-size: 14px; line-height: 1.5; color: var(--text-muted); }
  .tile { background: var(--surface-2); border-radius: var(--radius-xl); padding: 14px 16px; font-size: 15px; line-height: 1.55; transition: background .15s; }
  .tile:hover { background: var(--surface-3); }
  .cap { margin: 8px 0 0; font-size: 12px; color: var(--text-subtle); }
</style>
<div class="card">
  <h2>Team mood</h2>
  <p>Answers sit on a recessed tile — hover it to see the surface step.</p>
  <div class="tile">The new PR template reduced back-and-forth by providing context.</div>
  <p class="cap">— Respondent 2</p>
</div>
