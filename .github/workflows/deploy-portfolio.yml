name: Deploy portfolio

# 建置 portfolio/ 這個 Vite 專案，並把成品推到 gh-pages 分支。
# 之後到 repo Settings → Pages → Source 選「Deploy from a branch」→ gh-pages / (root) 即可上線。

on:
  push:
    branches:
      - claude/session-continuation-m6qihm
    paths:
      - "portfolio/**"
      - ".github/workflows/deploy-portfolio.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-portfolio
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: portfolio

      - name: Build
        run: npm run build
        working-directory: portfolio

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./portfolio/dist
